<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --bg: #FBF6EC;
    --card: #FFFFFF;
    --ink: #2E2A22;
    --sub: #8A8370;
    --accent: #E08A3E;
    --accent-soft: #FCEBD8;
    --line: #EDE4D0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .counter {
    font-size: 14px;
    color: var(--sub);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .card {
    position: relative;
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 var(--line);
    padding: 64px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
  }

  .word {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--ink);
    text-align: center;
    line-height: 1;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .word.leaving {
    opacity: 0;
    transform: translateY(-10px) scale(0.96);
  }

  .word.entering {
    opacity: 0;
    transform: translateY(10px) scale(0.96);
  }

  .next {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 18px;
    padding: 16px 48px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }

  .next:hover { background: #F9DDBB; }
  .next:active { transform: scale(0.96); }

  .dot-row {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
  }

  .dot.filled { background: var(--accent); }

  @media (max-width: 420px) {
    .word { font-size: 48px; }
    .card { padding: 48px 20px; min-height: 180px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="counter" id="counter">word 1</div>
  <div class="card">
    <div class="word" id="word"></div>
  </div>
  <button class="next" id="nextBtn">next word</button>
  <div class="dot-row" id="dots"></div>
</div>

<script>
  const words = [
    "ant", "apple", "arm",
    "bat", "box", "bed",
    "cat", "cup", "cow",
    "dog", "duck", "dad",
    "egg", "elephant", "eat",
    "fish", "frog", "fox",
    "goat", "gum", "garden",
    "hat", "hen", "house",
    "ice", "igloo", "insect",
    "jam", "jet", "jump",
    "kite", "king", "kick",
    "leg", "lion", "lamp",
    "map", "milk", "moon",
    "nut", "nest", "net",
    "owl", "ox", "orange",
    "pig", "pen", "plant",
    "queen", "quilt", "quack",
    "rat", "run", "rain",
    "sun", "star", "six",
    "top", "tree", "ten",
    "up", "umbrella", "under",
    "van", "vase", "vet",
    "wet", "web", "wag",
    "x-ray",
    "yes", "yo-yo", "yarn",
    "zoo", "zip", "zebra"
  ];

  let order = [];
  let index = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildDots() {
    const dots = document.getElementById('dots');
    dots.innerHTML = '';
    const total = Math.min(order.length, 10);
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      dots.appendChild(d);
    }
  }

  function updateDots() {
    const dots = document.getElementById('dots').children;
    const total = dots.length;
    const pos = index % total;
    for (let i = 0; i < total; i++) {
      dots[i].classList.toggle('filled', i <= pos);
    }
  }

  function showWord(animate) {
    if (index >= order.length) {
      order = shuffle(words);
      index = 0;
    }
    const el = document.getElementById('word');
    const counter = document.getElementById('counter');

    const render = () => {
      el.textContent = order[index];
      counter.textContent = 'word ' + (index + 1);
      el.classList.remove('leaving');
      el.classList.add('entering');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.remove('entering'));
      });
      updateDots();
    };

    if (animate) {
      el.classList.add('leaving');
      setTimeout(render, 150);
    } else {
      render();
    }
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    index++;
    showWord(true);
  });

  order = shuffle(words);
  buildDots();
  showWord(false);
</script>

</body>
</html>
