<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word game</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --bg: #FBF6EC;
    --card: #FFFFFF;
    --ink: #2E2A22;
    --sub: #8A8370;
    --accent: #E08A3E;
    --accent-soft: #FCEBD8;
    --line: #EDE4D0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .stage {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .counter {
    font-size: 14px;
    color: var(--sub);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .card {
    position: relative;
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    border: 1px solid var(--line);
    box-shadow: 0 2px 0 var(--line);
    padding: 64px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
  }

  .word {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--ink);
    text-align: center;
    line-height: 1;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .word.leaving {
    opacity: 0;
    transform: translateY(-10px) scale(0.96);
  }

  .word.entering {
    opacity: 0;
    transform: translateY(10px) scale(0.96);
  }

  .next {
    font-family: 'Atkinson Hyperlegible', sans-serif;
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
    background: var(--accent-soft);
    border: none;
    border-radius: 18px;
    padding: 16px 48px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }

  .next:hover { background: #F9DDBB; }
  .next:active { transform: scale(0.96); }

  .dot-row {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
  }

  .dot.filled { background: var(--accent); }

  .settings-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--sub);
    opacity: 0.35;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .settings-btn:hover,
  .settings-btn:focus-visible {
    opacity: 1;
    background: var(--accent-soft);
  }

  .settings-btn svg { width: 18px; height: 18px; }

  .settings-panel {
    position: fixed;
    top: 54px;
    right: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(46, 42, 34, 0.1);
    padding: 6px;
    display: flex;
    flex-direction: column;
    min-width: 180px;
    z-index: 10;
  }

  .settings-panel[hidden] { display: none; }

  .settings-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--sub);
    font-weight: 700;
    padding: 6px 12px 4px;
  }

  .settings-option {
    text-align: left;
    border: none;
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .settings-option:hover { background: var(--accent-soft); }

  .settings-option.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
  }

  @media (max-width: 420px) {
    .word { font-size: 48px; }
    .card { padding: 48px 20px; min-height: 180px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="counter" id="counter">word 1</div>
  <div class="card">
    <div class="word" id="word"></div>
  </div>
  <button class="next" id="nextBtn">next word</button>
  <div class="dot-row" id="dots"></div>
</div>

<button class="settings-btn" id="settingsBtn" aria-label="Word difficulty settings" aria-expanded="false" aria-haspopup="true">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>
<div class="settings-panel" id="settingsPanel" hidden>
  <div class="settings-title">Word difficulty</div>
  <button class="settings-option" data-level="all">All words</button>
  <button class="settings-option" data-level="basics">Just the basics</button>
  <button class="settings-option" data-level="challenge">Trickier words</button>
</div>

<script>
  const words = [
    { word: "ant", level: 1 }, { word: "apple", level: 1 }, { word: "arm", level: 2 },
    { word: "bat", level: 1 }, { word: "box", level: 1 }, { word: "bed", level: 1 },
    { word: "cat", level: 1 }, { word: "cup", level: 1 }, { word: "cow", level: 2 },
    { word: "dog", level: 1 }, { word: "duck", level: 1 }, { word: "dad", level: 1 },
    { word: "egg", level: 1 }, { word: "elf", level: 1 }, { word: "eat", level: 2 },
    { word: "fish", level: 1 }, { word: "frog", level: 1 }, { word: "fox", level: 1 },
    { word: "goat", level: 2 }, { word: "gum", level: 1 }, { word: "garden", level: 2 },
    { word: "hat", level: 1 }, { word: "hen", level: 1 }, { word: "house", level: 2 },
    { word: "ice", level: 2 }, { word: "igloo", level: 2 }, { word: "insect", level: 1 },
    { word: "jam", level: 1 }, { word: "jet", level: 1 }, { word: "jump", level: 1 },
    { word: "kite", level: 2 }, { word: "king", level: 1 }, { word: "kick", level: 1 },
    { word: "leg", level: 1 }, { word: "lion", level: 2 }, { word: "lamp", level: 1 },
    { word: "map", level: 1 }, { word: "milk", level: 1 }, { word: "moon", level: 2 },
    { word: "nut", level: 1 }, { word: "nest", level: 1 }, { word: "net", level: 1 },
    { word: "owl", level: 2 }, { word: "ox", level: 1 }, { word: "otter", level: 2 },
    { word: "pig", level: 1 }, { word: "pen", level: 1 }, { word: "plant", level: 1 },
    { word: "queen", level: 2 }, { word: "quilt", level: 1 }, { word: "quack", level: 1 },
    { word: "rat", level: 1 }, { word: "run", level: 1 }, { word: "rain", level: 2 },
    { word: "sun", level: 1 }, { word: "star", level: 2 }, { word: "six", level: 1 },
    { word: "top", level: 1 }, { word: "tree", level: 2 }, { word: "ten", level: 1 },
    { word: "up", level: 1 }, { word: "umbrella", level: 2 }, { word: "under", level: 2 },
    { word: "van", level: 1 }, { word: "vase", level: 2 }, { word: "vet", level: 1 },
    { word: "wet", level: 1 }, { word: "web", level: 1 }, { word: "wag", level: 1 },
    { word: "x-ray", level: 2 },
    { word: "yes", level: 1 }, { word: "yo-yo", level: 2 }, { word: "yarn", level: 2 },
    { word: "zoo", level: 2 }, { word: "zip", level: 1 }, { word: "zebra", level: 2 }
  ];

  const DIFFICULTY_FILTERS = {
    all: () => true,
    basics: (w) => w.level === 1,
    challenge: (w) => w.level === 2
  };

  let difficulty = 'all';
  try {
    const saved = localStorage.getItem('wordGameDifficulty');
    if (saved && DIFFICULTY_FILTERS[saved]) difficulty = saved;
  } catch (e) {}

  function getPool() {
    return words.filter(DIFFICULTY_FILTERS[difficulty]).map((w) => w.word);
  }

  let order = [];
  let index = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildDots() {
    const dots = document.getElementById('dots');
    dots.innerHTML = '';
    const total = Math.min(order.length, 10);
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      dots.appendChild(d);
    }
  }

  function updateDots() {
    const dots = document.getElementById('dots').children;
    const total = dots.length;
    const pos = index % total;
    for (let i = 0; i < total; i++) {
      dots[i].classList.toggle('filled', i <= pos);
    }
  }

  function showWord(animate) {
    if (index >= order.length) {
      order = shuffle(getPool());
      index = 0;
    }
    const el = document.getElementById('word');
    const counter = document.getElementById('counter');

    const render = () => {
      el.textContent = order[index];
      const dotTotal = Math.min(order.length, 10);
      counter.textContent = 'word ' + ((index % dotTotal) + 1) + ' of ' + dotTotal;
      el.classList.remove('leaving');
      el.classList.add('entering');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.remove('entering'));
      });
      updateDots();
    };

    if (animate) {
      el.classList.add('leaving');
      setTimeout(render, 150);
    } else {
      render();
    }
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    index++;
    showWord(true);
  });

  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');

  function updateSettingsUI() {
    settingsPanel.querySelectorAll('.settings-option').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.level === difficulty);
    });
  }

  function closeSettings() {
    settingsPanel.setAttribute('hidden', '');
    settingsBtn.setAttribute('aria-expanded', 'false');
  }

  settingsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isHidden = settingsPanel.hasAttribute('hidden');
    if (isHidden) {
      settingsPanel.removeAttribute('hidden');
      settingsBtn.setAttribute('aria-expanded', 'true');
    } else {
      closeSettings();
    }
  });

  settingsPanel.querySelectorAll('.settings-option').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.level !== difficulty) {
        difficulty = btn.dataset.level;
        try { localStorage.setItem('wordGameDifficulty', difficulty); } catch (e) {}
        order = shuffle(getPool());
        index = 0;
        buildDots();
        showWord(false);
        updateSettingsUI();
      }
      closeSettings();
    });
  });

  document.addEventListener('click', (e) => {
    if (!settingsPanel.hasAttribute('hidden') && !settingsPanel.contains(e.target) && e.target !== settingsBtn) {
      closeSettings();
    }
  });

  updateSettingsUI();
  order = shuffle(getPool());
  buildDots();
  showWord(false);
</script>

</body>
</html>
